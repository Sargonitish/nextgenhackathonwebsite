<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Node Unreachable | HACKX 2026</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0B1F3A;
      color: #F4F1EA;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .card {
      max-width: 540px;
      width: 100%;
      background: #0E2442;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 36px;
      position: relative;
      box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #FCEE0A;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .code {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: 72px;
      line-height: 1;
      color: #FCEE0A;
      margin-bottom: 8px;
      letter-spacing: -0.04em;
    }
    h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #F4F1EA;
      margin-bottom: 16px;
    }
    p {
      font-size: 13px;
      color: rgba(244, 241, 234, 0.75);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .log-box {
      background: #081629;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 14px;
      font-size: 12px;
      color: rgba(244, 241, 234, 0.6);
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .log-box code {
      color: #FCEE0A;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      padding: 12px 20px;
      transition: all 0.15s ease-in-out;
      cursor: pointer;
    }
    .btn-primary {
      background-color: #FCEE0A;
      color: #0B1F3A;
      border: 1px solid #FCEE0A;
      box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.4);
    }
    .btn-primary:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.5);
    }
    .btn-secondary {
      background: transparent;
      color: #F4F1EA;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-secondary:hover {
      border-color: #FCEE0A;
      color: #FCEE0A;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">[ SYSTEM FAULT / ROUTE NOT FOUND ]</div>
    <div class="code">404</div>
    <h1>PAGE_NOT_FOUND // NODE_UNREACHABLE</h1>
    <p>
      The requested route or asset does not exist on this hackathon cluster node. It may have moved or been decommissioned.
    </p>
    <div class="log-box">
      <div>&gt; STATUS: <code>404_HTTP_NOT_FOUND</code></div>
      <div>&gt; CLUSTER: <code>hackx-chennai-production</code></div>
    </div>
    <div class="btn-row">
      <a href="/" class="btn btn-primary">RETURN TO HOME</a>
      <a href="/find-registration" class="btn btn-secondary">FIND REGISTRATION PASS</a>
    </div>
  </div>
</body>
</html>
